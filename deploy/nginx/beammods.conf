# /etc/nginx/sites-available/beammods.conf
# Replace every "api.example.com" with your real API subdomain.
# Ubuntu 24.04 ships nginx 1.24 -> "listen 443 ssl http2" syntax (not "http2 on").

limit_req_zone  $binary_remote_addr zone=bm_api:10m   rate=10r/s;
limit_req_zone  $binary_remote_addr zone=bm_write:10m rate=1r/s;
limit_req_zone  $binary_remote_addr zone=bm_verify:10m rate=2r/s;
proxy_cache_path /var/cache/nginx/beammods_photos levels=1:2 keys_zone=bm_photos:10m
                 max_size=500m inactive=7d use_temp_path=off;

upstream beammods_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

# ── HTTP: ACME challenge + redirect ─────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # BeamNG's LuaSocket can't do TLS, so /verify is also served over plain HTTP.
    # Safe: every response is Ed25519-signed and bound to a client nonce.
    location = /verify {
        limit_req zone=bm_verify burst=20 nodelay;
        limit_req_status 429;
        limit_except GET { deny all; }
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://beammods_backend;
    }

    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS ───────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 25m;          # admin image upload (base64)
    limit_req_status 429;
    access_log /var/log/nginx/beammods.access.log;
    error_log  /var/log/nginx/beammods.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Telegram webhook — only Telegram's networks may POST here.
    # https://core.telegram.org/bots/webhooks#the-short-version
    location /tg/ {
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        deny  all;
        limit_except POST { deny all; }
        access_log off;                # URL contains the secret path
        proxy_pass http://beammods_backend;
    }

    # Payment provider callbacks (Click / Payme).
    # The handlers verify every call (Click MD5 signature, Payme Basic-auth +
    # amount), so correctness never depends on the source IP. The optional
    # allowlist below is defence-in-depth — Payme publishes a fixed range;
    # Click does not, so leave Click to the signature check. Uncomment and keep
    # updated from the providers' docs if you want IP filtering too.
    location /payment/ {
        # allow 185.234.113.0/24;   # Payme production notification range
        # deny  all;                # (enabling deny blocks Click — keep commented unless Payme-only)
        limit_req zone=bm_api burst=30 nodelay;   # providers retry; keep headroom
        limit_except POST { deny all; }
        proxy_pass http://beammods_backend;
    }

    # Mod cover images — cached by Nginx so Telegram is hit once per file_id.
    location /api/photo/ {
        limit_req zone=bm_api burst=40 nodelay;
        proxy_cache            bm_photos;
        proxy_cache_key        $uri;           # ignore ?_t= cache busters
        proxy_cache_valid      200 7d;
        proxy_cache_valid      404 1m;
        proxy_cache_use_stale  error timeout updating;
        proxy_cache_lock       on;
        add_header X-Cache $upstream_cache_status always;
        proxy_pass http://beammods_backend;
    }

    # State-changing Mini App endpoints — tighter limit.
    location ~ ^/api/(download|upload_image)$ {
        limit_req zone=bm_write burst=5 nodelay;
        proxy_pass http://beammods_backend;
    }

    location /api/ {
        limit_req zone=bm_api burst=20 nodelay;
        proxy_pass http://beammods_backend;
    }

    location = /health {
        access_log off;
        proxy_pass http://beammods_backend;
    }

    # DRM license check (signed responses)
    location = /verify {
        limit_req zone=bm_verify burst=20 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://beammods_backend;
    }

    # Everything else — closed.
    location / { return 404; }
}
