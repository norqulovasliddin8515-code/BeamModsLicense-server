<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BeamModsStudio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
    /* ═══════════════════════════════════════════════
       DESIGN TOKENS — Modern E-Commerce Dark UI
    ═══════════════════════════════════════════════ */
    :root {
        --bg:        #0a0a0f;
        --bg2:       #111118;
        --surface:   #16161f;
        --surface2:  #1e1e2a;
        --surface3:  #252535;
        --accent:    #7c3aed;
        --accent2:   #a855f7;
        --accent3:   #c084fc;
        --neon:      #8b5cf6;
        --green:     #10b981;
        --orange:    #f59e0b;
        --red:       #ef4444;
        --text:      #f8fafc;
        --text2:     #cbd5e1;
        --muted:     #64748b;
        --border:    rgba(255,255,255,0.06);
        --border2:   rgba(124,58,237,0.3);
        --radius:    16px;
        --radius-lg: 24px;
        --radius-xl: 32px;
        --shadow:    0 20px 60px rgba(0,0,0,0.6);
        --glow:      0 0 40px rgba(124,58,237,0.25);
    }

    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

    html, body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        height: 100%;
        overflow: hidden;
    }

    /* ─── SCROLLBAR ─────────────────────────────── */
    ::-webkit-scrollbar { width:3px; height:3px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--surface3); border-radius:4px; }

    /* ─── APP LAYOUT ────────────────────────────── */
    .app {
        max-width: 480px;
        margin: 0 auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
    }

    /* ─── HEADER ────────────────────────────────── */
    .header {
        padding: 16px 20px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        background: var(--bg);
        position: relative;
        z-index: 10;
    }
    .header-left { display:flex; flex-direction:column; gap:2px; }
    .header-greeting {
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
        letter-spacing: 0.3px;
    }
    .brand {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 22px;
        font-weight: 700;
        background: linear-gradient(135deg, #a78bfa, #7c3aed, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.5px;
    }
    .header-right { display:flex; gap:8px; align-items:center; }
    .hdr-btn {
        width: 40px; height: 40px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        display: flex; align-items:center; justify-content:center;
        cursor: pointer; font-size: 17px;
        transition: all .2s;
        position: relative;
    }
    .hdr-btn:active { transform: scale(.9); background: var(--surface2); }
    .hdr-btn .badge-dot {
        position: absolute; top: 7px; right: 7px;
        width: 7px; height: 7px;
        background: var(--accent2);
        border-radius: 50%;
        border: 1.5px solid var(--bg);
    }
    .avatar-btn {
        width: 40px; height: 40px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        border-radius: 12px;
        display: flex; align-items:center; justify-content:center;
        font-size: 16px; cursor:pointer;
        font-weight: 700; color: #fff;
        box-shadow: 0 4px 14px rgba(124,58,237,0.4);
    }

    /* ─── PAGES ─────────────────────────────────── */
    .page { display:none; flex:1; overflow:hidden; flex-direction:column; }
    .page.active { display:flex; }

    /* ─── HERO BANNER ───────────────────────────── */
    .hero-section {
        margin: 0 20px 16px;
        flex-shrink: 0;
    }
    .hero-card {
        background: linear-gradient(135deg, #1a0533 0%, #2d1b69 50%, #1a0533 100%);
        border: 1px solid rgba(124,58,237,0.3);
        border-radius: var(--radius-xl);
        padding: 20px;
        position: relative;
        overflow: hidden;
        min-height: 140px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
    }
    .hero-card::before {
        content: '';
        position: absolute;
        top: -30px; right: -30px;
        width: 160px; height: 160px;
        background: radial-gradient(circle, rgba(168,85,247,0.4) 0%, transparent 70%);
        pointer-events: none;
    }
    .hero-card::after {
        content: '🎮';
        position: absolute;
        top: 16px; right: 20px;
        font-size: 52px;
        opacity: 0.4;
        transform: rotate(-12deg);
    }
    .hero-tag {
        background: rgba(124,58,237,0.5);
        border: 1px solid rgba(168,85,247,0.4);
        color: var(--accent3);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 4px 10px;
        border-radius: 20px;
        display: inline-block;
        margin-bottom: 8px;
        width: fit-content;
    }
    .hero-title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.2;
        margin-bottom: 4px;
        color: #fff;
    }
    .hero-subtitle {
        font-size: 12px;
        color: rgba(255,255,255,0.6);
        font-weight: 400;
    }

    /* ─── SEARCH BAR ────────────────────────────── */
    .search-wrap {
        margin: 0 20px 14px;
        flex-shrink: 0;
    }
    .search-bar {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        display: flex; align-items:center;
        padding: 4px 14px;
        transition: border-color .2s;
    }
    .search-bar:focus-within {
        border-color: rgba(124,58,237,0.5);
        box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
    }
    .search-bar input {
        flex:1; border:none; background:transparent;
        color:var(--text); font-size:14px; padding:11px 0 11px 10px;
        outline:none; font-family: 'Inter', sans-serif;
    }
    .search-bar input::placeholder { color:var(--muted); }
    .search-icon { color:var(--muted); font-size:15px; flex-shrink:0; }

    /* ─── SECTION HEADER ────────────────────────── */
    .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        margin-bottom: 12px;
        flex-shrink: 0;
    }
    .section-title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
    }
    .section-link {
        font-size: 12px;
        color: var(--accent3);
        font-weight: 600;
        cursor: pointer;
    }

    /* ─── CATEGORY CHIPS ────────────────────────── */
    .filter-scroll {
        display:flex; gap:8px;
        overflow-x:auto; padding:0 20px 14px;
        scrollbar-width:none; flex-shrink:0;
    }
    .filter-scroll::-webkit-scrollbar { display:none; }
    .filter-chip {
        white-space:nowrap; padding:8px 18px;
        background:var(--surface);
        border: 1px solid var(--border);
        border-radius: 30px;
        font-size:13px; font-weight:600;
        color:var(--muted); cursor:pointer;
        transition: all .2s;
        font-family: 'Inter', sans-serif;
        flex-shrink: 0;
    }
    .filter-chip.active {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #fff;
        border-color: transparent;
        box-shadow: 0 4px 14px rgba(124,58,237,0.4);
    }

    /* ─── CATALOG GRID ──────────────────────────── */
    .catalog-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 0 20px 100px;
    }
    .catalog-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    /* ─── MOD CARD ──────────────────────────────── */
    .mod-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        overflow: hidden;
        cursor: pointer;
        transition: all .25s cubic-bezier(.4,0,.2,1);
        position: relative;
    }
    .mod-card:active { transform: scale(.95); }
    .mod-card-img-wrap {
        position: relative;
        overflow: hidden;
    }
    .mod-card img {
        width:100%; height:120px;
        object-fit:cover; display:block;
        transition: transform .3s;
    }
    .mod-card:active img { transform: scale(1.05); }
    .mod-card-overlay {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 50%;
        background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
        pointer-events: none;
    }
    .mod-card-body {
        padding: 10px 12px 13px;
    }
    .mod-card-name {
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 8px;
        color: var(--text);
        font-family: 'Space Grotesk', sans-serif;
    }
    .mod-card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .mod-cat-pill {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 3px 8px;
        border-radius: 6px;
        background: var(--surface3);
        color: var(--muted);
    }
    .mod-dl-icon {
        width: 28px; height: 28px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        border-radius: 8px;
        display: flex; align-items:center; justify-content:center;
        font-size: 12px;
        box-shadow: 0 4px 10px rgba(124,58,237,0.4);
        transition: transform .15s;
    }

    /* FEATURED (wide) card — 1st item */
    .mod-card.featured {
        grid-column: span 2;
        display: flex;
        flex-direction: row;
        height: 110px;
    }
    .mod-card.featured .mod-card-img-wrap {
        width: 120px;
        flex-shrink: 0;
    }
    .mod-card.featured img { height: 100%; border-radius: 0; }
    .mod-card.featured .mod-card-overlay {
        display: none;
    }
    .mod-card.featured .mod-card-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 14px 14px 14px;
    }
    .mod-card.featured .mod-card-name {
        font-size: 14px;
        white-space: normal;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        text-overflow: ellipsis;
        margin-bottom: 10px;
    }
    .featured-badge {
        position: absolute;
        top: 10px; left: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #fff;
        font-size: 9px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 3px 8px;
        border-radius: 6px;
    }

    /* ─── SHORTS PAGE ───────────────────────────── */
    #page-shorts {
        position: relative;
        overflow: hidden;
        touch-action: none;
    }
    .shorts-container {
        display:flex; flex-direction:column;
        height:100%; overflow:hidden; position:relative;
    }
    .short-slide {
        position:absolute; width:100%; height:100%;
        display:flex; flex-direction:column;
        align-items:center; justify-content:center;
        transition:transform .4s cubic-bezier(.4,0,.2,1);
        will-change:transform;
    }
    .yt-player-wrap {
        position:absolute; top:0; left:0;
        width:100%; height:100%; pointer-events:none;
    }
    .yt-player-wrap iframe { width:100%; height:100%; border:none; }
    .short-gradient {
        position:absolute; bottom:0; left:0;
        width:100%; height:60%;
        background:linear-gradient(to top, rgba(0,0,0,.92) 0%, transparent 100%);
        pointer-events:none;
    }
    .short-info {
        position:absolute; bottom:100px; left:0; right:0;
        padding:0 20px; z-index:10;
    }
    .short-mod-name {
        font-family:'Space Grotesk',sans-serif;
        font-size:20px; font-weight:800;
        margin-bottom:4px;
        text-shadow:0 1px 8px rgba(0,0,0,.8);
        letter-spacing:-0.3px;
    }
    .short-mod-cat {
        font-size:13px; color:rgba(255,255,255,.65);
        margin-bottom:14px;
    }
    .short-buy-btn {
        display:inline-flex; align-items:center; gap:8px;
        background:linear-gradient(135deg, var(--accent), var(--accent2));
        color:#fff; border:none;
        padding:13px 24px; border-radius:30px;
        font-size:14px; font-weight:700; cursor:pointer;
        box-shadow:0 6px 24px rgba(124,58,237,.5);
        transition:transform .15s;
        font-family:'Inter',sans-serif;
        pointer-events:auto;
    }
    .short-buy-btn:active { transform:scale(.95); }
    .scroll-hint {
        position:absolute; right:14px;
        display:flex; flex-direction:column;
        align-items:center; gap:10px; z-index:20;
        bottom:110px;
    }
    .scroll-hint-btn {
        width:38px; height:38px;
        background:rgba(255,255,255,.1);
        backdrop-filter:blur(10px);
        border:1px solid rgba(255,255,255,.15);
        border-radius:50%; display:flex;
        align-items:center; justify-content:center;
        font-size:16px; cursor:pointer;
        transition:transform .15s;
    }
    .scroll-hint-btn:active { transform:scale(.9); }
    .short-dots {
        position:absolute; right:14px; top:50%;
        transform:translateY(-50%);
        display:flex; flex-direction:column; gap:6px; z-index:20;
    }
    .short-dot {
        width:4px; height:16px; border-radius:2px;
        background:rgba(255,255,255,.25);
        transition:all .3s;
    }
    .short-dot.active { background:#fff; height:28px; }

    /* ─── BOTTOM SHEET ──────────────────────────── */
    .sheet-backdrop {
        position:fixed; inset:0;
        background:rgba(0,0,0,.75);
        backdrop-filter:blur(14px);
        z-index:100; opacity:0; pointer-events:none;
        transition:opacity .3s;
    }
    .sheet-backdrop.open { opacity:1; pointer-events:auto; }
    .bottom-sheet {
        position:fixed; bottom:0; left:50%; width:100%; max-width:480px;
        transform:translate(-50%, 100%);
        background: var(--surface);
        border-radius:28px 28px 0 0;
        padding: 0 0 36px;
        z-index:101; max-height:92vh; overflow-y:auto;
        transition:transform .4s cubic-bezier(.16,1,.3,1);
        border-top: 1px solid var(--border);
    }
    .bottom-sheet.open { transform:translate(-50%, 0); }

    .sheet-handle-wrap {
        padding: 14px 0 4px;
        text-align: center;
        cursor: pointer;
    }
    .sheet-handle {
        width: 36px; height: 4px; border-radius: 2px;
        background: var(--surface3);
        display: inline-block;
    }
    .sheet-hero {
        position: relative;
        margin: 0 0 20px;
    }
    .sheet-img {
        width:100%; height:220px;
        object-fit:cover; display:block;
    }
    .sheet-hero-overlay {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 60%;
        background: linear-gradient(to top, var(--surface), transparent);
        pointer-events: none;
    }
    .sheet-hero-badge {
        position: absolute;
        top: 14px; right: 14px;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        padding: 5px 12px;
        font-size: 11px;
        font-weight: 700;
        color: var(--accent3);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .sheet-content {
        padding: 0 22px;
    }
    .sheet-title {
        font-family:'Space Grotesk',sans-serif;
        font-size:22px; font-weight:800;
        margin-bottom: 6px;
        letter-spacing: -0.3px;
        line-height: 1.2;
    }
    .sheet-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
    }
    .sheet-cat {
        font-size:12px; font-weight:700; text-transform:uppercase;
        letter-spacing: 0.5px;
        padding:4px 10px; border-radius:8px;
        background:var(--surface3); color:var(--muted);
    }
    .sheet-dot { color: var(--surface3); }
    .sheet-sub-info {
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
    }
    .sheet-divider {
        height: 1px;
        background: var(--border);
        margin: 14px 0;
    }
    .sheet-desc-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
        margin-bottom: 8px;
    }
    .sheet-desc {
        font-size: 14px;
        line-height: 1.65;
        color: var(--text2);
        margin-bottom: 24px;
    }
    .sheet-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 22px;
    }
    .stat-box {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px;
        text-align: center;
    }
    .stat-val {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 2px;
    }
    .stat-lbl {
        font-size: 10px;
        color: var(--muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .cta-wrap {
        display: flex;
        gap: 10px;
        align-items: center;
    }
    .cta-btn {
        flex: 1; padding: 16px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #fff; border: none; border-radius: 16px;
        font-size: 15px; font-weight: 700; cursor: pointer;
        box-shadow: 0 8px 24px rgba(124,58,237,.45);
        transition: all .2s;
        font-family: 'Inter', sans-serif;
        letter-spacing: 0.2px;
    }
    .cta-btn:active { transform: scale(.97); }
    .fav-btn {
        width: 52px; height: 52px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 14px;
        display: flex; align-items:center; justify-content:center;
        font-size: 20px; cursor: pointer;
        transition: all .2s;
        flex-shrink: 0;
    }
    .fav-btn:active { transform: scale(.92); background: var(--surface3); }

    /* ─── BOTTOM NAV ────────────────────────────── */
    .bottom-nav-wrap {
        position: fixed; bottom: 0;
        left: 50%; transform: translateX(-50%);
        width: 100%; max-width: 480px;
        z-index: 60;
        pointer-events: none;
    }
    .bottom-nav {
        background: rgba(22, 22, 31, 0.95);
        border-top: 1px solid var(--border);
        backdrop-filter: blur(20px);
        padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        justify-content: space-around;
        pointer-events: auto;
    }
    .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 6px 16px;
        border-radius: 14px;
        cursor: pointer;
        transition: all .2s;
        color: var(--muted);
        user-select: none;
        min-width: 56px;
    }
    .nav-item .nav-icon { font-size: 20px; line-height: 1; }
    .nav-item .nav-lbl {
        font-size: 10px;
        font-weight: 600;
        white-space: nowrap;
        display: none;
        letter-spacing: 0.3px;
    }
    .nav-item.active {
        color: var(--accent2);
    }
    .nav-item.active .nav-lbl {
        display: block;
        color: var(--accent2);
    }
    .nav-item.active .nav-icon { font-size: 22px; }
    .nav-center-btn {
        width: 52px; height: 52px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        border-radius: 16px;
        display: flex; align-items:center; justify-content:center;
        font-size: 22px; cursor: pointer;
        box-shadow: 0 6px 20px rgba(124,58,237,.5);
        transition: transform .2s;
        pointer-events: auto;
        flex-shrink: 0;
        margin-top: -8px;
    }
    .nav-center-btn:active { transform: scale(.9); }

    /* ─── AI FAB ────────────────────────────────── */
    .ai-fab {
        position: fixed; bottom: 90px; right: 20px;
        width: 50px; height: 50px;
        background: linear-gradient(135deg, #7c3aed, #a855f7);
        border-radius: 15px;
        display: flex; align-items:center; justify-content:center;
        font-size: 20px; cursor: pointer; z-index: 50;
        box-shadow: 0 8px 24px rgba(124,58,237,.5);
        transition: transform .2s;
    }
    .ai-fab:active { transform: scale(.9); }

    /* ─── LOADER ────────────────────────────────── */
    .loader {
        display:flex; flex-direction:column;
        align-items:center; justify-content:center;
        gap:12px; padding:60px 0;
        color:var(--muted); font-size:14px;
        grid-column: span 2;
    }
    .spinner {
        width:32px; height:32px;
        border: 3px solid var(--surface3);
        border-top-color: var(--accent);
        border-radius:50%;
        animation:spin .7s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
<div class="app">

    <!-- ── HEADER ──────────────────────────────────── -->
    <header class="header">
        <div class="header-left">
            <span class="header-greeting">Xush kelibsiz 👋</span>

// ── Foydalanuvchi ID sini olish ──────────────────────
function getTelegramUserId() {
    if (window.Telegram?.WebApp?.initDataUnsafe?.user?.id) {
        const id = window.Telegram.WebApp.initDataUnsafe.user.id;
        try { localStorage.setItem('beam_user_id', id); } catch (_) {}
        return id;
    }
    if (window.Telegram?.WebApp?.initData) {
        try {
            const params = new URLSearchParams(window.Telegram.WebApp.initData);
            const userStr = params.get('user');
            if (userStr) {
                const user = JSON.parse(decodeURIComponent(userStr));
                if (user && user.id) {
                    try { localStorage.setItem('beam_user_id', user.id); } catch (_) {}
                    return user.id;
                }
            }
        } catch (e) {}
    }
    const urlParams = new URLSearchParams(window.location.search);
    const urlUserId = urlParams.get('user_id') || urlParams.get('tgWebAppUserId');
    if (urlUserId) {
        const id = parseInt(urlUserId);
        if (id) {
            try { localStorage.setItem('beam_user_id', id); } catch (_) {}
            return id;
        }
    }
    try {
        const cached = localStorage.getItem('beam_user_id');
        if (cached) return parseInt(cached);
    } catch (_) {}
    return null;
}

async function loadCatalog() {
    const grid = document.getElementById('catalogGrid');
    grid.innerHTML = '<div class="loader" style="grid-column:span 2"><div class="spinner"></div><span>Yuklanmoqda...</span></div>';

    let data = null;
    const bust = '?_t=' + Date.now();

    try {
        const res = await fetch('/api/mods' + bust, { cache: 'no-store' });
        if (res.ok) {
            const parsed = await res.json();
            if (parsed && parsed.ok && Array.isArray(parsed.mods) && parsed.mods.length > 0) {
                data = parsed;
            }
        }
    } catch (e) {}

    if (!data) {
        try {
            const res = await fetch('/mods.json' + bust, { cache: 'no-store' });
            if (res.ok) {
                const parsed = await res.json();
                if (parsed && parsed.ok && Array.isArray(parsed.mods) && parsed.mods.length > 0) {
                    data = parsed;
                }
            }
        } catch (e) {}
    }

    if (!data && typeof API_URL !== 'undefined' && API_URL) {
        try {
            const res = await fetch(`${API_URL}/api/mods` + bust, {
                signal:  AbortSignal.timeout(4000),
                headers: { 'ngrok-skip-browser-warning': 'true' },
                cache:   'no-store'
            });
            if (res.ok) {
                const parsed = await res.json();
                if (parsed && parsed.ok && Array.isArray(parsed.mods) && parsed.mods.length > 0) {
                    data = parsed;
                }
            }
        } catch (e) {}
    }

    if (data && Array.isArray(data.mods) && data.mods.length > 0) {
        allMods = data.mods.map(m => {
            let thumb = m.image_url || m.thumbnail || '';
            if (thumb.startsWith('tg_photo:')) {
                const photoId = thumb.replace('tg_photo:', '');
                thumb = (typeof API_URL !== 'undefined' && API_URL)
                    ? `${API_URL}/api/photo/${photoId}`
                    : `/api/photo/${photoId}`;
            }
            return { ...m, youtube_url: m.video_url || '', thumbnail: thumb };
        });
    } else {
        allMods = DEMO_MODS;
    }

    shortMods = allMods.filter(m => m.youtube_url);
    renderCatalog(allMods);
    renderShortsFeed();
}

function applyFilters() {
    const q   = document.getElementById('searchInput').value.toLowerCase();
    const cat = activeCategory;
    const filtered = allMods.filter(m => {
        const matchCat  = cat === 'all' || m.category === cat;
        const matchText = m.name.toLowerCase().includes(q)

// ── Shorts Feed ──────────────────────────────────────
function extractYTId(url) {
    if (!url) return null;
    const patterns = [
        /youtube\.com\/shorts\/([^?&]+)/,
        /youtu\.be\/([^?&]+)/,
        /youtube\.com\/watch\?v=([^&]+)/,
    ];
    for (const re of patterns) {
        const m = url.match(re);
        if (m) return m[1];
    }
    return null;
}

function renderShortsFeed() {
    const container = document.getElementById('shortsContainer');
    const dotsEl    = document.getElementById('shortDots');
    container.innerHTML = '';
    dotsEl.innerHTML    = '';

    if (!shortMods.length) {
        container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:15px;text-align:center;padding:30px">
            📹 Hozircha Shorts videolar mavjud emas.<br>Admin tez orada qo'shadi!</div>`;
        return;
    }

    shortMods.forEach((mod, i) => {
        const slide = document.createElement('div');
        slide.className = 'short-slide';
        slide.id        = `slide-${i}`;
        slide.style.transform = i === 0 ? 'translateY(0%)' : `translateY(${i*100}%)`;
        slide.innerHTML = `
            <div class="yt-player-wrap" id="yt-wrap-${i}">
                <div id="yt-player-${i}"></div>
            </div>
            <div class="short-gradient"></div>
            <div class="short-info">
                <div class="short-mod-name">${mod.name}</div>
                <div class="short-mod-cat">📂 ${mod.category}</div>
                <button class="short-buy-btn" onclick="openSheet(${mod.id})">⬇️ Yuklab olish</button>
            </div>`;
        container.appendChild(slide);

        const dot = document.createElement('div');
        dot.className = `short-dot${i === 0 ? ' active' : ''}`;
        dot.id        = `dot-${i}`;
        dotsEl.appendChild(dot);
    });

    if (window.ytApiReady) initAllPlayers();
    setupSwipeGesture(container);
}

window.ytApiReady = false;
window.onYouTubeIframeAPIReady = function () {
    window.ytApiReady = true;
    if (shortMods.length > 0) initAllPlayers();
};

function initAllPlayers() {
    shortMods.forEach((mod, i) => {
        if (ytPlayers[i]) return;
        const ytId = extractYTId(mod.youtube_url);
        if (!ytId) return;
        ytPlayers[i] = new YT.Player(`yt-player-${i}`, {
            videoId: ytId,
            playerVars: { autoplay:0, controls:0, loop:1, playlist:ytId, mute:0, playsinline:1, rel:0, modestbranding:1, fs:0 },
            height: '100%', width: '100%',
            events: {
                onReady: (e) => {
                    if (currentTab === 'shorts' && i === currentShortIdx) {
                        e.target.playVideo();
                    }
                },
            },
        });
    });
}

function playShort(idx) {
    if (!ytPlayers[idx] || !ytPlayers[idx].playVideo) return;
    ytPlayers[idx].playVideo();
}

function pauseAllPlayers() {
    Object.values(ytPlayers).forEach(p => {
        try { if (p && p.pauseVideo) p.pauseVideo(); } catch (_) {}
    });
}

function navigateShort(dir) {
    const next = currentShortIdx + dir;
    if (next < 0 || next >= shortMods.length) return;
    try { ytPlayers[currentShortIdx]?.pauseVideo(); } catch (_) {}
    shortMods.forEach((_, i) => {
        const slide = document.getElementById(`slide-${i}`);
        if (slide) slide.style.transform = `translateY(${(i - next) * 100}%)`;
        const dot = document.getElementById(`dot-${i}`);
        if (dot) dot.className = `short-dot${i === next ? ' active' : ''}`;
    });
    currentShortIdx = next;
    setTimeout(() => playShort(currentShortIdx), 350);
    tg.HapticFeedback.impactOccurred('light');
}

function setupSwipeGesture(container) {
    let startY = 0, isDragging = false;
    container.addEventListener('touchstart', e => { startY = e.touches[0].clientY; isDragging = true; }, { passive: true });
    container.addEventListener('touchend', e => {
        if (!isDragging) return;
        isDragging = false;
        const dy = startY - e.changedTouches[0].clientY;
        if (Math.abs(dy) > 50) navigateShort(dy > 0 ? 1 : -1);
    }, { passive: true });
    container.addEventListener('wheel', e => { navigateShort(e.deltaY > 0 ? 1 : -1); }, { passive: true });
}

async function downloadCurrent() {

        if (window.Telegram?.WebApp?.sendData) {
            btn.innerText = '⏳ Botga yuborilmoqda...';

            tg.sendData(JSON.stringify({ action: 'download_mod', mod_id: currentMod.id }));
            setTimeout(() => { closeSheet(); tg.close(); }, 1200);
            return;
        }
        btn.innerText = '⚠️ Telegram botdan oching';
        setTimeout(() => { btn.innerText = '⬇️ Yuklab olish'; btn.disabled = false; }, 2500);
        return;
    }

    btn.innerText = '⏳ Yuborilmoqda...';
    btn.disabled  = true;

    // 1. Vercel serverless
    try {
        const res  = await fetch('/api/download', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ mod_id: currentMod.id, user_id: userId }),
        });
        const data = await res.json();
        if (data.ok) {
            btn.innerText        = '✅ Yuborildi! Chat-ni oching';
            btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
            tg.HapticFeedback?.notificationOccurred?.('success');
            setTimeout(() => {
                btn.innerText = '⬇️ Yuklab olish';
                btn.disabled  = false;
                btn.style.background = '';
                closeSheet();
            }, 3000);
            return;
        } else if (data.error === 'demo') {
            btn.innerText        = '🚧 Tez orada qo\'shiladi!';
            btn.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
            setTimeout(() => {
                btn.innerText = '⬇️ Yuklab olish';
                btn.disabled  = false;
                btn.style.background = '';
            }, 2500);
            return;
        }
    } catch (e) {}

    // 2. ngrok fallback
    if (typeof API_URL !== 'undefined' && API_URL) {
        try {
            const res  = await fetch(`${API_URL}/api/download`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                body:    JSON.stringify({ mod_id: currentMod.id, user_id: userId }),
            });
            const data = await res.json();
            if (data.ok) {
                btn.innerText        = '✅ Yuborildi! Chat-ni oching';
                btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                tg.HapticFeedback?.notificationOccurred?.('success');
                setTimeout(() => {
                    btn.innerText = '⬇️ Yuklab olish';
                    btn.disabled  = false;
                    btn.style.background = '';
                    closeSheet();
                }, 3000);
                return;
            }
        } catch (e) {}
    }

    // 3. sendData fallback
    if (window.Telegram?.WebApp?.sendData) {
        btn.innerText = '⏳ Botga yuborilmoqda...';
        tg.sendData(JSON.stringify({ action: 'download_mod', mod_id: currentMod.id }));
        setTimeout(() => { closeSheet(); tg.close(); }, 1200);
        return;
    }

    btn.innerText        = '❌ Xatolik — qayta urinib ko\'ring';
    btn.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';
    setTimeout(() => {
        btn.innerText = '⬇️ Yuklab olish';
        btn.disabled  = false;
        btn.style.background = '';
    }, 2500);
}

    tg.sendData(JSON.stringify({ action: 'get_orders' }));
    tg.HapticFeedback.impactOccurred('light');
    tg.close();
}
function openAIChat() {
    tg.sendData(JSON.stringify({ action: 'open_ai' }));
    tg.HapticFeedback.impactOccurred('medium');
    tg.close();
}

loadCatalog();
