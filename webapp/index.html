<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BeamModsStudio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
    /* ══════════════════════════════════════════════════
       FIGMA E-COMMERCE STYLE — Light Clean Design
    ══════════════════════════════════════════════════ */
    :root {
        --bg:        #F7F7F7;
        --white:     #FFFFFF;
        --orange:    #FF6B35;
        --orange2:   #FF8C5A;
        --orange-lt: rgba(255,107,53,0.10);
        --dark:      #1A1A2E;
        --dark2:     #2D2D44;
        --gray:      #8A8A9A;
        --gray2:     #C4C4D4;
        --gray-lt:   #F0F0F5;
        --border:    #EBEBF0;
        --card-bg:   #FFFFFF;
        --text:      #1A1A2E;
        --text2:     #5A5A7A;
        --radius:    16px;
        --radius-lg: 24px;
        --shadow:    0 4px 24px rgba(0,0,0,0.08);
        --shadow-sm: 0 2px 12px rgba(0,0,0,0.05);
        --shadow-btn:0 8px 20px rgba(255,107,53,0.35);
        --green:     #10B981;
        --green-lt:  rgba(16, 185, 129, 0.1);
    }

    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

    html, body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        height: 100%;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width:0px; height:0px; display: none; }

    .app {
        max-width: 100%;
        margin: 0 auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
    }

    .page { display:none; flex:1; overflow-y:auto; flex-direction:column; padding-bottom: 80px;}
    .page.active { display:flex; }

    /* ── HEADER & SUB BANNER ──────────────────────────────────────  */
    .hdr {
        padding: 18px 20px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        background: var(--bg);
    }
    .hdr-greeting { font-size: 13px; color: var(--gray); font-weight: 500; margin-bottom: 2px; }
    .hdr-title { font-size: 22px; font-weight: 800; color: var(--dark); letter-spacing: -0.5px; }
    
    .sub-banner {
        margin: 0 20px 15px;
        padding: 12px 16px;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 600;
        font-size: 14px;
        transition: 0.3s;
    }
    .sub-banner.free { background: var(--gray-lt); color: var(--text2); }
    .sub-banner.pro { background: var(--orange-lt); color: var(--orange); border: 1px solid var(--orange); }
    .sub-banner.max { background: var(--green-lt); color: var(--green); border: 1px solid var(--green); }
    .sub-banner-btn {
        background: var(--orange);
        color: var(--white);
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 700;
        border: none;
        cursor: pointer;
    }

    /* ── CATALOG ────────────────────────────────────── */
    .cats {
        display: flex; gap: 10px; padding: 0 20px 15px; overflow-x: auto; flex-shrink: 0;
    }
    .cat-btn {
        padding: 8px 18px; border-radius: 20px; font-size: 14px; font-weight: 600;
        background: var(--white); color: var(--text2); border: 1px solid var(--border);
        white-space: nowrap; transition: 0.2s; cursor:pointer;
    }
    .cat-btn.active { background: var(--dark); color: var(--white); border-color: var(--dark); }

    .grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 20px 20px;
    }
    .card {
        background: var(--card-bg); border-radius: var(--radius); overflow: hidden;
        box-shadow: var(--shadow-sm); border: 1px solid var(--border);
        display: flex; flex-direction: column; cursor: pointer; transition: 0.2s;
    }
    .card:active { transform: scale(0.97); }
    .card-img {
        width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--gray-lt);
    }
    .card-body { padding: 12px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
    .card-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
    .card-price {
        font-size: 13px; font-weight: 800; color: var(--orange);
        display: inline-block; background: var(--orange-lt); padding: 4px 8px; border-radius: 8px;
    }
    .card-price.free-sub { color: var(--green); background: var(--green-lt); }

    /* ── MOD DETAILS PAGE ────────────────────────────────────── */
    .dt-img { width: 100%; height: 280px; object-fit: cover; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; }
    .dt-body { padding: 20px; }
    .dt-cat { font-size: 12px; font-weight: 700; color: var(--orange); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .dt-title { font-size: 24px; font-weight: 800; margin-bottom: 12px; line-height: 1.2; }
    .dt-desc { font-size: 15px; color: var(--text2); line-height: 1.6; margin-bottom: 24px; }
    .dt-actions { display: flex; gap: 12px; margin-top: auto; padding: 20px; background: var(--white); border-top: 1px solid var(--border); }
    
    .btn {
        flex: 1; padding: 16px; border-radius: var(--radius); font-size: 16px; font-weight: 700;
        border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .btn-primary { background: var(--orange); color: var(--white); box-shadow: var(--shadow-btn); }
    .btn-primary:active { background: var(--orange2); transform: translateY(2px); box-shadow: none; }
    .btn-secondary { background: var(--gray-lt); color: var(--text); }
    .btn-drm { background: var(--green); color: var(--white); box-shadow: 0 8px 20px rgba(16,185,129,0.3); }

    /* ── PAYMENT MODAL ────────────────────────────────────── */
    .modal-overlay {
        position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5);
        display: none; align-items: flex-end; z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal {
        background: var(--white); width: 100%; border-top-left-radius: var(--radius-lg); border-top-right-radius: var(--radius-lg);
        padding: 24px 20px 32px; transform: translateY(100%); animation: slideUp 0.3s forwards ease-out;
    }
    @keyframes slideUp { to { transform: translateY(0); } }
    .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .modal-sub { font-size: 14px; color: var(--text2); margin-bottom: 20px; }
    .pay-btn {
        width: 100%; padding: 16px; border-radius: var(--radius); font-size: 16px; font-weight: 700;
        border: none; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .pay-stars { background: #2AABEE; color: #FFF; }
    .pay-card  { background: #1A1A2E; color: #FFF; }

    /* Loading overlay */
    .loader-overlay {
        position: fixed; top:0; left:0; right:0; bottom:0; background: var(--bg);
        display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--orange); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app">
    <!-- Loader -->
    <div class="loader-overlay" id="loader"><div class="spinner"></div></div>

    <!-- CATALOG PAGE -->
    <div id="pageCatalog" class="page active">
        <div class="hdr">
            <div class="hdr-left">
                <div class="hdr-greeting">Xush kelibsiz</div>
                <div class="hdr-title" id="userName">...</div>
            </div>
            <div class="hdr-right">
                <div class="hdr-icon" onclick="loadData()">🔄</div>
            </div>
        </div>
        
        <!-- Subscription Banner -->
        <div id="subBanner" class="sub-banner free">
            <span>Holat tekshirilmoqda...</span>
        </div>

        <div class="cats" id="catList"></div>
        <div class="grid" id="modList"></div>
    </div>

    <!-- DETAILS PAGE -->
    <div id="pageDetails" class="page">
        <div style="flex:1; overflow-y:auto;">
            <img id="dtImg" class="dt-img" src="" alt="Mod">
            <div class="dt-body">
                <div id="dtCat" class="dt-cat">Category</div>
                <div id="dtTitle" class="dt-title">Title</div>
                <div id="dtDesc" class="dt-desc">Description</div>
            </div>
        </div>
        <div class="dt-actions">
            <button class="btn btn-secondary" onclick="showPage('pageCatalog')">Orqaga</button>
            <button id="dtBtnMain" class="btn btn-primary" onclick="handleMainAction()">...</button>
        </div>
    </div>
</div>

<!-- PAYMENT MODAL -->
<div id="payModal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-title" id="modalTitle">Obuna xarid qilish</div>
        <div class="modal-sub" id="modalSub">Ushbu modni yuklab olish uchun sizga aktiv obuna kerak.</div>
        <button class="pay-btn pay-stars" onclick="startPay('stars')">⭐️ Telegram Stars orqali</button>
        <button class="pay-btn pay-card" onclick="startPay('card')">💳 Karta (Uzcard/Humo)</button>
    </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

const API_BASE = ""; // Agar HTML xuddi shu domenda yotsa
let mods = [];
let cats = [];
let currentMod = null;
let currentSub = { tier: "free", is_active: false };
let payIntent = ""; // e.g. "sub:pro" or "mod:12"

document.getElementById('userName').textContent = tg.initDataUnsafe?.user?.first_name || "O'yinchi";

async function api(path, opts = {}) {
    if (opts.method === 'POST') {
        opts.headers = { 'Content-Type': 'application/json' };
        if(opts.body) {
            let b = JSON.parse(opts.body);
            b.init_data = tg.initData;
            opts.body = JSON.stringify(b);
        } else {
            opts.body = JSON.stringify({ init_data: tg.initData });
        }
    }
    const res = await fetch(API_BASE + path, opts);
    return res.json();
}

async function loadData() {
    document.getElementById('loader').style.display = 'flex';
    try {
        const [meRes, modsRes, catsRes] = await Promise.all([
            api('/api/me', { method: 'POST' }),
            api('/api/mods'),
            api('/api/categories')
        ]);
        
        if(meRes.ok) {
            currentSub = meRes.subscription;
            updateSubBanner();
        }
        if (modsRes.ok) {
            mods = modsRes.mods;
            renderMods();
        }
        if (catsRes.ok) {
            cats = catsRes.categories;
            renderCats();
        }
    } catch (e) {
        tg.showAlert("Serverga ulanishda xatolik!");
    } finally {
        document.getElementById('loader').style.display = 'none';
    }
}

function updateSubBanner() {
    const banner = document.getElementById('subBanner');
    if(currentSub.is_active && currentSub.tier !== 'free') {
        banner.className = `sub-banner ${currentSub.tier}`;
        banner.innerHTML = `<span>${currentSub.emoji} ${currentSub.name} — ${currentSub.days_left} kun qoldi</span>`;
    } else {
        banner.className = 'sub-banner free';
        banner.innerHTML = `<span>🆓 Obuna yo'q</span> <button class="sub-banner-btn" onclick="openSubModal()">Pro olish</button>`;
    }
}

function renderCats() {
    const box = document.getElementById('catList');
    box.innerHTML = `<div class="cat-btn active" onclick="filterMods('all', this)">Barchasi</div>`;
    cats.forEach(c => {
        box.innerHTML += `<div class="cat-btn" onclick="filterMods('${c.name}', this)">${c.name}</div>`;
    });
}

function filterMods(catName, el) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderMods(catName);
}

function renderMods(filterCat = 'all') {
    const box = document.getElementById('modList');
    box.innerHTML = '';
    mods.forEach(m => {
        if (filterCat !== 'all' && m.category !== filterCat) return;
        const img = m.image_url && m.image_url.startsWith("tg_photo:") 
            ? API_BASE + "/api/photo/" + m.image_url.split(":")[1]
            : m.image_url || 'https://via.placeholder.com/400x300?text=No+Image';
        
        let priceHtml = '';
        if(m.price == 0 && !m.mod_key) {
            priceHtml = `<div class="card-price free-sub">Bepul</div>`;
        } else if (currentSub.is_active) {
            priceHtml = `<div class="card-price free-sub">Obunada tekin</div>`;
        } else {
            priceHtml = `<div class="card-price">${m.price.toLocaleString('ru-RU')} UZS</div>`;
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openMod(m);
        card.innerHTML = `
            <img src="${img}" class="card-img" alt="${m.name}">
            <div class="card-body">
                <div class="card-title">${m.name}</div>
                <div>${priceHtml}</div>
            </div>
        `;
        box.appendChild(card);
    });
}

function openMod(m) {
    currentMod = m;
    const img = m.image_url && m.image_url.startsWith("tg_photo:") 
        ? API_BASE + "/api/photo/" + m.image_url.split(":")[1]
        : m.image_url || 'https://via.placeholder.com/400x300';
    
    document.getElementById('dtImg').src = img;
    document.getElementById('dtCat').textContent = m.category;
    document.getElementById('dtTitle').textContent = m.name;
    document.getElementById('dtDesc').textContent = m.description || 'Ma\'lumot yo\'q';
    
    const btn = document.getElementById('dtBtnMain');
    const isFree = (m.price == 0 && !m.mod_key);
    
    if (isFree) {
        btn.textContent = "Tekin yuklash";
        btn.className = "btn btn-primary";
    } else if (currentSub.is_active) {
        btn.textContent = "⬇️ Yuklab olish (DRM)";
        btn.className = "btn btn-drm";
    } else {
        btn.textContent = "⭐ Obuna xarid qilish";
        btn.className = "btn btn-primary";
    }
    
    showPage('pageDetails');
}

async function handleMainAction() {
    const isFree = (currentMod.price == 0 && !currentMod.mod_key);
    
    if (!isFree && !currentSub.is_active) {
        openSubModal();
        return;
    }

    // Yuklab olish / API chaqiruv
    document.getElementById('dtBtnMain').textContent = "Tayyorlanmoqda...";
    document.getElementById('dtBtnMain').disabled = true;
    
    try {
        const res = await api('/api/download', {
            method: 'POST',
            body: JSON.stringify({ mod_id: currentMod.id })
        });
        
        if (res.ok) {
            tg.showAlert(`✅ ${res.name} fayli Telegram DM yozishmangizga yuborildi!`);
        } else if (res.error === "subscription_required") {
            openSubModal();
        } else {
            tg.showAlert("Xatolik: " + res.error);
        }
    } catch (e) {
        tg.showAlert("Aloqa xatosi!");
    } finally {
        document.getElementById('dtBtnMain').disabled = false;
        openMod(currentMod); // tugma holatini tiklash
    }
}

function openSubModal() {
    payIntent = "sub:pro"; // Default to Pro sub upgrade
    document.getElementById('modalTitle').textContent = "⭐ Pro Obuna";
    document.getElementById('modalSub').textContent = "Barcha pullik modlarni cheklovsiz yuklab olish uchun Pro obunani xarid qiling (29 900 UZS / oy).";
    document.getElementById('payModal').classList.add('active');
}

function closeModal(e) {
    if (e.target.id === 'payModal') {
        document.getElementById('payModal').classList.remove('active');
    }
}

async function startPay(provider) {
    document.getElementById('payModal').classList.remove('active');
    document.getElementById('loader').style.display = 'flex';
    try {
        const res = await api('/api/pay/start', {
            method: 'POST',
            body: JSON.stringify({ intent: payIntent, provider: provider })
        });
        
        document.getElementById('loader').style.display = 'none';
        
        if (res.ok) {
            tg.showAlert("✅ To'lov cheki yozishmaga yuborildi. Telegram ga qaytib to'lovni tasdiqlang!", () => {
                tg.close();
            });
        } else {
            tg.showAlert("Xatolik: " + res.error);
        }
    } catch (e) {
        document.getElementById('loader').style.display = 'none';
        tg.showAlert("Aloqada xatolik.");
    }
}

function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(id === 'pageCatalog') {
        tg.BackButton.hide();
    } else {
        tg.BackButton.show();
        tg.BackButton.onClick(() => showPage('pageCatalog'));
    }
}

// Boshlang'ich yuklash
loadData();
</script>
</body>
</html>
